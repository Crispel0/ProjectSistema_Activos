{% extends 'partials/body.html' %}
{% load crispy_forms_tags %}


{% block content %}
<div class="row container-fluid">
        <div class="card p-3 w-50 m-auto col-sm-12 col-md-12  col-lg-12">
            <div class="card-body">
                <h2>{{titulo_vista}}</h2>
            </div>
            <div class="card-text">
                <form method="POST">
                    {% csrf_token %}
                    {{form | crispy}}
                    <button type="submit" class="btn btn-success" onclick="showSweetAlert('agregar' ,'administar_software')">Guardar </button>
                    <a onclick="showSweetAlert('eliminar' ,'../')" class="btn btn-danger"> Volver</a>
                </form>
            </div>
        </div>
</div>
{% endblock %}  


{% include 'partials/footer.html' %}
